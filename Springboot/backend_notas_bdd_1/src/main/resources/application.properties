spring.application.name=backend_notas_bdd_1
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3096/notas?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# JPA / Hibernate configurations
#sirve para crear y actualizar las tablas en la base de datos
spring.jpa.hibernate.ddl-auto=update
#sirve para ver las consultas SQL que se ejecutan en la base de datos
spring.jpa.show-sql=true
#especifica el dialecto de la base de datos MySQL (Hibernate 7.x)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect