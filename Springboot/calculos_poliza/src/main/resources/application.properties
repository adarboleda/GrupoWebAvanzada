spring.application.name=calculos_poliza
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3096/seguros_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / Hibernate configurations
#sirve para crear y actualizar las tablas en la base de datos
spring.jpa.hibernate.ddl-auto=update
#sirve para ver las consultas SQL que se ejecutan en la base de datos
spring.jpa.show-sql=true
#especifica el dialecto de la base de datos MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect