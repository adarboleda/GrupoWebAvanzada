<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Factura</title>
  </head>
  <body>
    <h2>Factura</h2>
    <form th:action="@{/calcular}" th:object="${factura}" method="post">
      <label for="codigo">Codigo:</label>
      <input
        type="text"
        id="codigo"
        th:field="*{codigo}"
        required
      /><br /><br />

      <label for="descripcion">Descripcion:</label>
      <input
        type="text"
        id="descripcion"
        th:field="*{descripcion}"
        required
      /><br /><br />

      <label for="cantidad">Cantidad:</label>
      <input
        type="number"
        id="cantidad"
        th:field="*{cantidad}"
        required
      /><br /><br />

      <label for="precioUnitario">Precio Unitario:</label>
      <input
        type="number"
        step="0.01"
        id="precioUnitario"
        th:field="*{precioUnitario}"
        required
      /><br /><br />

      <button type="submit">Calcular Total</button>
    </form>

    <div th:if="${factura.total != null && factura.total > 0}">
      <hr />
      <h3>Resultado:</h3>
      <p><strong>Código:</strong> <span th:text="${factura.codigo}"></span></p>
      <p>
        <strong>Descripción:</strong>
        <span th:text="${factura.descripcion}"></span>
      </p>
      <p>
        <strong>Cantidad:</strong> <span th:text="${factura.cantidad}"></span>
      </p>
      <p>
        <strong>Precio Unitario:</strong> $<span
          th:text="${#numbers.formatDecimal(factura.precioUnitario, 1, 2)}"
        ></span>
      </p>
      <hr />
      <p>
        <strong>Subtotal:</strong> $<span
          th:text="${#numbers.formatDecimal(factura.subtotal, 1, 2)}"
        ></span>
      </p>
      <p>
        <strong>Descuento:</strong> $<span
          th:text="${#numbers.formatDecimal(factura.descuento, 1, 2)}"
        ></span>
      </p>
      <p>
        <strong>IVA (15%):</strong> $<span
          th:text="${#numbers.formatDecimal(factura.iva, 1, 2)}"
        ></span>
      </p>
      <p style="font-size: 1.2em">
        <strong
          >TOTAL A PAGAR: $<span
            th:text="${#numbers.formatDecimal(factura.total, 1, 2)}"
          ></span
        ></strong>
      </p>
    </div>
  </body>
</html>
