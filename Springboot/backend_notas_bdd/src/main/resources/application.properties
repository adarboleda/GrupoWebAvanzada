spring.application.name=backend_notas_bdd
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3096/notas
spring.datasource.username=root
spring.datasource.password=
# JPA / Hibernate configurations
#sirve para crear y actualizar las tablas en la base de datos
spring.jpa.hibernate.ddl-auto=update
#sirve para ver las consultas SQL que se ejecutan en la base de datos
spring.jpa.show-sql=true 
#especifica el dialecto de la base de datos MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect