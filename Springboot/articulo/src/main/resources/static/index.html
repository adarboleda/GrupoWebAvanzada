<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Artículos y Rubros</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <div class="container">
      <h1>Sistema de Gestión de Artículos</h1>

      <!-- Sección de Rubros -->
      <div class="section">
        <h2>Gestión de Rubros (Categorías)</h2>
        <div class="form-container">
          <h3 id="tituloFormRubro">Agregar Nuevo Rubro</h3>
          <form id="formRubro">
            <input type="hidden" id="rubroId" />
            <div class="form-group">
              <label for="nombreRubro">Nombre de la Categoría:</label>
              <input type="text" id="nombreRubro" name="nombre" required />
            </div>
            <button type="submit" id="btnGuardarRubro">Guardar Rubro</button>
            <button
              type="button"
              id="btnCancelarRubro"
              style="display: none"
              onclick="cancelarEdicionRubro()"
            >
              Cancelar
            </button>
          </form>
        </div>

        <div class="list-container">
          <h3>Lista de Rubros</h3>
          <table id="tablaRubros">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- Sección de Artículos -->
      <div class="section">
        <h2>Gestión de Artículos</h2>
        <div class="form-container">
          <h3 id="tituloFormArticulo">Agregar Nuevo Artículo</h3>
          <form id="formArticulo">
            <input type="hidden" id="articuloId" />
            <div class="form-group">
              <label for="nombreArticulo">Nombre del Artículo:</label>
              <input type="text" id="nombreArticulo" name="nombre" required />
            </div>
            <div class="form-group">
              <label for="precioArticulo">Precio:</label>
              <input
                type="number"
                id="precioArticulo"
                name="precio"
                step="0.01"
                required
              />
            </div>
            <div class="form-group">
              <label for="descripcionArticulo">Descripción:</label>
              <textarea
                id="descripcionArticulo"
                name="descripcion"
                rows="3"
                required
              ></textarea>
            </div>
            <div class="form-group">
              <label for="rubroArticulo">Categoría (Rubro):</label>
              <select id="rubroArticulo" name="rubroId" required>
                <option value="">Seleccione una categoría</option>
              </select>
            </div>
            <button type="submit" id="btnGuardarArticulo">
              Guardar Artículo
            </button>
            <button
              type="button"
              id="btnCancelarArticulo"
              style="display: none"
              onclick="cancelarEdicionArticulo()"
            >
              Cancelar
            </button>
          </form>
        </div>

        <div class="list-container">
          <h3>Lista de Artículos</h3>
          <table id="tablaArticulos">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Descripción</th>
                <th>Categoría</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
