spring.application.name=articulo
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3096/articulos_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / Hibernate configurations
#sirve para crear y actualizar las tablas en la base de datos
spring.jpa.hibernate.ddl-auto=update
#sirve para ver las consultas SQL que se ejecutan en la base de datos
spring.jpa.show-sql=true
# Dialecto de Hibernate para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true