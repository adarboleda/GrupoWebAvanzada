<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Autenticación OAuth</title>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <!-- Pantalla de Login -->
    <div id="login-screen" class="screen active">
      <div class="container">
        <div class="login-card">
          <div class="header">
            <h1>Iniciar Sesión</h1>
            <p>Ingresa tus credenciales para continuar</p>
          </div>

          <form id="login-form">
            <div class="form-group">
              <label for="username">Usuario</label>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Ingresa tu usuario"
                required
              />
            </div>

            <div class="form-group">
              <label for="password">Contraseña</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingresa tu contraseña"
                required
              />
            </div>

            <div id="error-message" class="error-message" style="display: none"></div>

            <button type="submit" class="btn-primary" id="login-btn">Iniciar Sesión</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Pantalla de Perfil -->
    <div id="profile-screen" class="screen">
      <div class="container">
        <div class="profile-card">
          <div class="header">
            <h1>Mi Perfil</h1>
          </div>

          <div id="loading" class="loading" style="display: none">
            <div class="spinner"></div>
            <p>Cargando perfil...</p>
          </div>

          <div id="profile-content" class="profile-content" style="display: none">
            <div class="profile-info">
              <div class="info-item">
                <span class="label">ID:</span>
                <span id="user-id" class="value">-</span>
              </div>
              <div class="info-item">
                <span class="label">Usuario:</span>
                <span id="user-username" class="value">-</span>
              </div>
              <div class="info-item">
                <span class="label">Nombre Completo:</span>
                <span id="user-nombre" class="value">-</span>
              </div>
              <div class="info-item">
                <span class="label">Email:</span>
                <span id="user-email" class="value">-</span>
              </div>
            </div>

            <div class="token-info">
              <p><strong>Token JWT:</strong></p>
              <div class="token-box" id="token-display"></div>
            </div>
          </div>

          <button class="btn-secondary" id="logout-btn">Cerrar Sesión</button>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
